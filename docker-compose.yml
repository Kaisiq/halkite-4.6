services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: halkantir
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: halkantir-api:latest
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MONGODB_URI: mongodb://mongo:27017/halkantir
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HALKANTIR_DATA_DIR: /app/data
    volumes:
      - api_data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: halkantir-web:latest
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - internal

volumes:
  mongo_data:
  api_data:

networks:
  internal:
    driver: bridge
